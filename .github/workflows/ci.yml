name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    # id-token: write is what lets the Codecov upload authenticate as this
    # workflow run instead of with a stored token. A job's permissions
    # replace the workflow's, so contents: read is restated.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Every tool is pinned in mise.toml, so CI and a local checkout run the
      # same binaries.
      - uses: jdx/mise-action@v5
        with:
          cache: true

      - run: mise run build

      - name: Run tests with coverage
        run: mise run coverage
        env:
          GOTESTFLAGS: -race

      # OIDC rather than a CODECOV_TOKEN secret: the repository is public, so
      # there is nothing a token would protect that the run's own identity
      # does not. A pull request from a fork reaches neither, and uploads
      # without either one.
      #
      # continue-on-error: Codecov being unreachable is not a reason to fail
      # a pull request.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov
          use_oidc: true
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - run: mise run lint

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          cache: true

      # docs/ is generated from the provider schema, so a schema change that
      # forgets to regenerate it fails here.
      - run: mise run docs-check
