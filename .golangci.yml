version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  # exportloopref and tenv from the v1 config are gone: Go 1.22 made loop
  # variables per-iteration, and usetesting replaces tenv.
  enable:
    - depguard
    - durationcheck
    - errcheck
    - forcetypeassert
    - godot
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting
  settings:
    # Keep the layers apart. internal/slack and internal/manifest know nothing
    # of the plugin framework or of internal/provider; only terraform-plugin-log
    # is allowed there, so that the Slack client's requests show in TF_LOG. Of
    # internal/provider, only the package itself talks to Slack.
    depguard:
      rules:
        framework-free:
          list-mode: lax
          files:
            - "**/internal/slack/*.go"
            - "**/internal/manifest/*.go"
          allow:
            - github.com/hashicorp/terraform-plugin-log
          deny:
            - pkg: github.com/hashicorp/terraform-plugin
              desc: internal/slack and internal/manifest know nothing of the plugin framework; adapt them in internal/provider
            - pkg: github.com/ymm-oss/terraform-provider-slackapp/internal/provider
              desc: internal/provider builds on internal/slack and internal/manifest, not the other way round
        provider-subpackages-offline:
          list-mode: lax
          files:
            - "**/internal/provider/*/*.go"
          deny:
            - pkg: github.com/ymm-oss/terraform-provider-slackapp/internal/slack
              desc: only internal/provider itself talks to Slack; its subpackages build Terraform pieces
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

# golangci-lint v2 runs these itself, so none of them is installed separately.
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/ymm-oss/terraform-provider-slackapp)
        - blank
        - dot
      custom-order: true
  exclusions:
    generated: lax
