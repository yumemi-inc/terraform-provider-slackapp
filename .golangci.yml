version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  # exportloopref and tenv from the v1 config are gone: Go 1.22 made loop
  # variables per-iteration, and usetesting replaces tenv.
  enable:
    - durationcheck
    - errcheck
    - forcetypeassert
    - godot
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

# golangci-lint v2 runs these itself, so none of them is installed separately.
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/ymm-oss/terraform-provider-slackapp)
        - blank
        - dot
      custom-order: true
  exclusions:
    generated: lax
